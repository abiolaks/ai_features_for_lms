<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tutor — LMS Demo</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }
  
  /* Sidebar */
  .sidebar {
    width: 320px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 16px;
    overflow-y: auto;
  }
  .sidebar h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .config-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .config-group label {
    font-size: 12px;
    color: var(--muted);
  }
  .config-group input, .config-group select {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  .config-group select { cursor: pointer; }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 6px 0;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.online { background: var(--success); }
  .dot.offline { background: var(--danger); }
  .dot.checking { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }
  .stat-box h3 { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .stat-box .value { font-size: 24px; font-weight: 700; }
  .stat-box .value.green { color: var(--success); }
  .stat-box .value.yellow { color: var(--warning); }
  .btn {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: var(--border); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  /* Chat */
  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
  }
  .msg.tutor {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .msg .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    display: flex;
    gap: 12px;
  }
  .msg .citations {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .msg .citation {
    font-size: 12px;
    color: var(--muted);
    padding: 4px 0;
    display: flex;
    gap: 8px;
  }
  .msg .citation .score {
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }
  .msg .citation .source {
    color: var(--text);
  }
  .msg .citation .excerpt {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
  }
  .msg.loading {
    align-self: flex-start;
    color: var(--muted);
    font-style: italic;
  }
  .chat-input {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  .chat-input textarea {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    font-family: inherit;
  }
  .chat-input textarea:focus { outline: none; border-color: var(--accent); }
  
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    z-index: 100;
    animation: slideIn 0.3s ease;
  }
  .toast.success { background: var(--success); color: #000; }
  .toast.error { background: var(--danger); color: #fff; }
  @keyframes slideIn { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
    gap: 8px;
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; max-width: 300px; }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
  }
  .suggestion {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    background: transparent;
    color: var(--text);
    transition: all 0.2s;
  }
  .suggestion:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>

<!-- ════════════════ SIDEBAR ════════════════ -->
<div class="sidebar">
  <h2>📚 Select Content</h2>
  
  <div class="config-group">
    <label>Lesson (pick from indexed content)</label>
    <select id="lessonSelect" onchange="onLessonChange()">
      <option value="any">— All content (course scope) —</option>
    </select>
  </div>
  <div id="scopeWarning" style="display:none;background:#1e293b;border:1px solid #3b82f6;border-radius:6px;padding:8px;font-size:11px;color:#93c5fd;margin-top:4px;">
    📌 Using <b>expand_scope: course</b>. Answers draw from all course content. Lesson-level filtering needs the LMS content export.
  </div>
  
  <h2>🔧 Configuration</h2>
  
  <div class="config-group">
    <label>Org ID</label>
    <input id="orgId" value="7591945d-10ba-4a39-adde-a495c2c9449b">
  </div>
  
  <div class="config-group">
    <label>Expand Scope</label>
    <select id="expandScope">
      <option value="course" selected>course (widest)</option>
      <option value="module">module</option>
      <option value="lesson">lesson</option>
    </select>
  </div>
  
  <div class="config-group">
    <label>Lesson ID</label>
    <input id="lessonId" value="any" placeholder="any">
  </div>
  
  <div class="config-group">
    <label>Course ID</label>
    <input id="courseId" value="any" placeholder="any">
  </div>
  
  <div class="config-group">
    <label>Module ID</label>
    <input id="moduleId" value="any" placeholder="any">
  </div>
  
  <div class="config-group">
    <label>Learner ID</label>
    <input id="learnerId" value="demo-learner-01">
  </div>
  
  <button class="btn btn-outline" onclick="clearHistory()">🗑 Clear History</button>
  
  <h2>📊 System Status</h2>
  
  <div class="status-row"><span class="dot checking" id="dot-tutor"></span> Tutor</div>
  <div class="status-row"><span class="dot checking" id="dot-indexing"></span> Indexing</div>
  <div class="status-row"><span class="dot checking" id="dot-gateway"></span> Gateway</div>

  <div class="stat-box">
    <h3>Videos Indexed</h3>
    <div class="value green" id="stat-videos">—</div>
  </div>
  <div class="stat-box">
    <h3>PDFs Indexed</h3>
    <div class="value green" id="stat-pdfs">—</div>
  </div>
  
  <button class="btn btn-outline" onclick="refreshStats()">🔄 Refresh Stats</button>
</div>

<!-- ════════════════ CHAT ════════════════ -->
<div class="chat">
  <div class="chat-header">🤖 AI Tutor</div>
  <div class="chat-messages" id="messages">
    <div class="empty-state">
      <div class="icon">💬</div>
      <p>Ask the AI tutor about your course content</p>
      <div class="suggestions">
        <button class="suggestion" onclick="askSuggestion('What is this course about?')">What is this course about?</button>
        <button class="suggestion" onclick="askSuggestion('How can SMEs adopt AI?')">How can SMEs adopt AI?</button>
        <button class="suggestion" onclick="askSuggestion('What are the foundations of AI?')">Foundations of AI?</button>
        <button class="suggestion" onclick="askSuggestion('Summarize this module')">Summarize this module</button>
      </div>
    </div>
  </div>
  <div class="chat-input">
    <textarea id="questionInput" placeholder="Ask a question..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askQuestion();}"></textarea>
    <button class="btn btn-primary" onclick="askQuestion()" id="sendBtn">Send</button>
  </div>
</div>

<script>
// ════════════════ CONFIG ════════════════
const TUTOR_URL = 'https://ai-tutor.yomi-alarape.workers.dev';
const INDEXING_URL = 'https://ai-indexing.yomi-alarape.workers.dev';
const GATEWAY_URL = 'https://ai-gateway.yomi-alarape.workers.dev';

function getConfig() {
  return {
    org_id: document.getElementById('orgId').value,
    expand_scope: document.getElementById('expandScope').value,
    lesson_id: document.getElementById('lessonId').value,
    course_id: document.getElementById('courseId').value,
    module_id: document.getElementById('moduleId').value,
    learner_id: document.getElementById('learnerId').value,
  };
}

// ════════════════ SYSTEM STATUS ════════════════
async function checkStatus(url, dotId) {
  const dot = document.getElementById(dotId);
  try {
    const resp = await fetch(url, { method: 'GET', headers: { 'Origin': 'https://learning.lumerax.co' } });
    dot.className = resp.ok ? 'dot online' : 'dot offline';
    return resp.ok;
  } catch { dot.className = 'dot offline'; return false; }
}

async function refreshStats() {
  document.getElementById('stat-videos').textContent = '...';
  document.getElementById('stat-pdfs').textContent = '...';
  
  // Count videos in Vectorize
  try {
    const resp = await fetch(`${TUTOR_URL}/diag-search?q=module+AI`);
    const data = await resp.json();
    const videos = new Set();
    const pdfs = new Set();
    (data.matches || []).forEach(m => {
      const t = m.metadata?.content_type;
      const org = m.metadata?.org_id;
      if (org !== getConfig().org_id) return;
      if (t === 'video') videos.add(m.metadata?.title);
      else pdfs.add(m.metadata?.title);
    });
    document.getElementById('stat-videos').textContent = videos.size;
    document.getElementById('stat-pdfs').textContent = pdfs.size;
  } catch(e) {
    document.getElementById('stat-videos').textContent = 'err';
    document.getElementById('stat-pdfs').textContent = 'err';
  }
  
  // Check workers
  await Promise.all([
    checkStatus(`${TUTOR_URL}/diag-search?q=test`, 'dot-tutor'),
    checkStatus(`${INDEXING_URL}/videos`, 'dot-indexing'),
    checkStatus(GATEWAY_URL, 'dot-gateway'),
  ]);
}

// ════════════════ CHAT ════════════════
const messages = document.getElementById('messages');
const input = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(role, content, citations, meta) {
  // Remove empty state
  const empty = messages.querySelector('.empty-state');
  if (empty) empty.remove();
  
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  
  // Format answer: convert markdown-like lists
  let html = content
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>')
    .replace(/(\d+\.\s)/g, '<br>$1');
  
  div.innerHTML = html;
  
  // Meta info
  if (meta) {
    const metaDiv = document.createElement('div');
    metaDiv.className = 'meta';
    if (meta.time) metaDiv.innerHTML += `<span>⏱ ${meta.time}</span>`;
    if (meta.citations) metaDiv.innerHTML += `<span>📎 ${meta.citations} sources</span>`;
    if (meta.history) metaDiv.innerHTML += `<span>💬 ${meta.history} msg history</span>`;
    div.appendChild(metaDiv);
  }
  
  // Citations
  if (citations && citations.length > 0) {
    const citeDiv = document.createElement('div');
    citeDiv.className = 'citations';
    citations.slice(0, 3).forEach(c => {
      citeDiv.innerHTML += `
        <div class="citation">
          <span class="score">${(c.score*100).toFixed(0)}%</span>
          <div>
            <div class="source">${c.lesson_title}</div>
            <div class="excerpt">"${c.excerpt?.substring(0,100)}..."</div>
          </div>
        </div>`;
    });
    div.appendChild(citeDiv);
  }
  
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addLoading() {
  const div = document.createElement('div');
  div.className = 'msg loading';
  div.id = 'loading-msg';
  div.textContent = 'Thinking...';
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function removeLoading() {
  const el = document.getElementById('loading-msg');
  if (el) el.remove();
}

async function askQuestion() {
  const question = input.value.trim();
  if (!question) return;
  
  const config = getConfig();
  addMessage('user', question);
  input.value = '';
  sendBtn.disabled = true;
  addLoading();
  
  const t0 = performance.now();
  try {
    const resp = await fetch(`${TUTOR_URL}/tutor/ask`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Origin': 'https://learning.lumerax.co',
      },
      body: JSON.stringify({
        question,
        learner_id: config.learner_id,
        lesson_id: config.lesson_id,
        course_id: config.course_id,
        module_id: config.module_id,
        org_id: config.org_id,
        expand_scope: config.expand_scope,
      }),
    });
    
    const data = await resp.json();
    const dt = ((performance.now() - t0) / 1000).toFixed(1);
    
    removeLoading();
    
    if (resp.ok) {
      addMessage('tutor', data.answer || '(empty response)', data.citations, {
        time: `${dt}s`,
        citations: data.citations?.length || 0,
        history: data.history_length,
      });
      
      if (data.scope_expansion_suggested) {
        showToast('Try expanding scope to "course" for better results', 'warning');
      }
    } else {
      addMessage('tutor', `Error: ${data.error || resp.statusText}`);
    }
  } catch (e) {
    removeLoading();
    addMessage('tutor', `Connection error: ${e.message}`);
  }
  
  sendBtn.disabled = false;
  input.focus();
}

function askSuggestion(text) {
  input.value = text;
  askQuestion();
}

async function clearHistory() {
  const config = getConfig();
  try {
    await fetch(`${TUTOR_URL}/tutor/clear`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Origin': 'https://learning.lumerax.co' },
      body: JSON.stringify({ learner_id: config.learner_id }),
    });
    messages.innerHTML = '';
    messages.innerHTML = `
      <div class="empty-state">
        <div class="icon">💬</div>
        <p>History cleared. Ask a new question!</p>
      </div>`;
    showToast('Session cleared', 'success');
  } catch(e) {
    showToast('Failed to clear session', 'error');
  }
}

function showToast(msg, type) {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ════════════════ CONTENT SELECTOR ════════════════
let knownLessons = [];

async function loadLessons() {
  try {
    const resp = await fetch(`${TUTOR_URL}/diag-search?q=module+lesson+AI+business`);
    const data = await resp.json();
    const seen = new Set();
    knownLessons = [];
    (data.matches || []).forEach(m => {
      const id = m.metadata?.lesson_id;
      const title = m.metadata?.title || id;
      const org = m.metadata?.org_id;
      const config = getConfig();
      if (!id || seen.has(id) || org !== config.org_id) return;
      seen.add(id);
      knownLessons.push({ id, title, course_id: m.metadata?.course_id || '', module_id: m.metadata?.module_id || '' });
    });
    
    const sel = document.getElementById('lessonSelect');
    sel.innerHTML = '<option value="any">— All content (course scope) —</option>';
    knownLessons.forEach(l => {
      sel.innerHTML += `<option value="${l.id}">${l.title} (${l.id.substring(0,20)}...)</option>`;
    });
  } catch(e) { console.error('Failed to load lessons:', e); }
}

function onLessonChange() {
  const sel = document.getElementById('lessonSelect');
  const scopeSel = document.getElementById('expandScope');
  const warning = document.getElementById('scopeWarning');
  
  if (sel.value === 'any') {
    document.getElementById('lessonId').value = 'any';
    document.getElementById('courseId').value = 'any';
    document.getElementById('moduleId').value = 'any';
    scopeSel.value = 'course';
    if (warning) warning.style.display = 'none';
  } else {
    const lesson = knownLessons.find(l => l.id === sel.value);
    if (lesson) {
      document.getElementById('lessonId').value = lesson.id;
      document.getElementById('courseId').value = lesson.course_id || 'any';
      document.getElementById('moduleId').value = lesson.module_id || 'any';
      scopeSel.value = 'course'; // lesson scope fails due to post-filter problem — use course
      if (warning) warning.style.display = 'block';
    }
  }
}

// ════════════════ INIT ════════════════
loadLessons();
refreshStats();
setInterval(refreshStats, 30000);
</script>
</body>
</html>
